<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triangle de Sierpiński</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

      :root {
        --bg:      #0a0a0f;
        --surface: #111118;
        --border:  #1e1e2e;
        --accent:  #00ffcc;
        --accent2: #ff6b6b;
        --accent3: #ffd166;
        --text:    #e8e8f0;
        --muted:   #555570;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Syne', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
      }

      /* Grid background */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }

      /* ── Header ────────────────────────────────── */
      header {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 2rem 1rem 1rem;
      }

      header h1 {
        font-size: clamp(1.8rem, 5vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, var(--accent), var(--accent3));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      header p {
        font-family: 'Space Mono', monospace;
        font-size: 0.72rem;
        color: var(--muted);
        margin-top: 0.4rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* ── Controls ──────────────────────────────── */
      .controls {
        position: relative;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        justify-content: center;
        padding: 1.2rem 1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        margin: 0.5rem 1rem 1.2rem;
        max-width: 700px;
        width: calc(100% - 2rem);
      }

      .ctrl-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        align-items: center;
      }

      .ctrl-group label {
        font-family: 'Space Mono', monospace;
        font-size: 0.65rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .iter-display {
        font-family: 'Space Mono', monospace;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent);
        min-width: 80px;
        text-align: center;
      }

      .iter-buttons {
        display: flex;
        gap: 0.4rem;
      }

      /* ── Buttons ───────────────────────────────── */
      .btn-sm {
        background: var(--border);
        border: 1px solid var(--muted);
        color: var(--text);
        font-family: 'Space Mono', monospace;
        font-size: 1rem;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-sm:hover {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
      }

      input[type="range"] {
        -webkit-appearance: none;
        width: 180px;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        box-shadow: 0 0 8px var(--accent);
      }

      .preset-btns {
        display: flex;
        gap: 0.4rem;
      }

      .preset {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-family: 'Space Mono', monospace;
        font-size: 0.65rem;
        padding: 0.3rem 0.6rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s;
        letter-spacing: 0.05em;
      }

      .preset:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .preset.active {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(0, 255, 204, 0.08);
      }

      .btn-run {
        background: var(--accent);
        color: var(--bg);
        border: none;
        font-family: 'Syne', sans-serif;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.6rem 1.6rem;
        border-radius: 10px;
        cursor: pointer;
        letter-spacing: 0.05em;
        transition: all 0.2s;
        box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      }

      .btn-run:hover {
        transform: scale(1.04);
        box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
      }

      .btn-run:active {
        transform: scale(0.98);
      }

      .btn-run.running {
        background: var(--accent2);
        box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
      }

      .btn-clear {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        font-family: 'Syne', sans-serif;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.6rem 1.2rem;
        border-radius: 10px;
        cursor: pointer;
        letter-spacing: 0.05em;
        transition: all 0.2s;
      }

      .btn-clear:hover {
        border-color: var(--accent2);
        color: var(--accent2);
      }

      /* ── Canvas ────────────────────────────────── */
      .canvas-wrap {
        position: relative;
        z-index: 1;
        width: calc(100% - 2rem);
        max-width: 620px;
        aspect-ratio: 1;
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        background: #08080d;
        box-shadow:
          0 0 60px rgba(0, 255, 204, 0.05),
          inset 0 0 40px rgba(0, 0, 0, 0.4);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ── Stats ─────────────────────────────────── */
      .stats {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 1.5rem;
        padding: 0.8rem 1rem;
        font-family: 'Space Mono', monospace;
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 0.6rem;
      }

      .stats span {
        color: var(--accent3);
        font-weight: 700;
      }

      /* ── Step info ─────────────────────────────── */
      .step-info {
        position: relative;
        z-index: 1;
        font-family: 'Space Mono', monospace;
        font-size: 0.65rem;
        color: var(--muted);
        text-align: center;
        padding: 0 1rem 2rem;
        max-width: 600px;
        line-height: 1.8;
      }

      .dot-vertex { color: var(--accent3); }
      .dot-point  { color: var(--accent2); }
      .dot-mid    { color: var(--accent);  }
    </style>
  </head>

  <body>

    <header>
      <h1>Triangle de Sierpiński</h1>
      <p>Jeu du chaos — Fractale par itérations aléatoires</p>
    </header>

    <!-- ── Controls ─────────────────────────────────── -->
    <div class="controls">

      <!-- Nombre d'itérations -->
      <div class="ctrl-group">
        <label>Itérations</label>
        <div class="iter-display" id="iterDisplay">1 000</div>
        <input type="range" id="iterSlider" min="1" max="7" value="3" step="1" />
        <div class="preset-btns">
          <button class="preset active" data-val="1">100</button>
          <button class="preset"        data-val="2">500</button>
          <button class="preset"        data-val="3">1K</button>
          <button class="preset"        data-val="4">5K</button>
          <button class="preset"        data-val="5">10K</button>
          <button class="preset"        data-val="6">50K</button>
          <button class="preset"        data-val="7">100K</button>
        </div>
      </div>

      <!-- Vitesse + boutons -->
      <div class="ctrl-group">
        <label>Vitesse</label>
        <div style="display:flex; gap:0.5rem; align-items:center;">
          <input type="range" id="speedSlider" min="1" max="5" value="3" step="1" style="width:120px;" />
          <span id="speedLabel" style="font-family:'Space Mono',monospace; font-size:0.75rem; color:var(--accent3);">×1</span>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn-run"   id="btnRun">▶ LANCER</button>
          <button class="btn-clear" id="btnClear">✕ EFFACER</button>
        </div>
      </div>

    </div><!-- /.controls -->

    <!-- ── Canvas ────────────────────────────────────── -->
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>

    <!-- ── Stats ─────────────────────────────────────── -->
    <div class="stats">
      <div>Points tracés : <span id="statPoints">0</span></div>
      <div>Progression :   <span id="statPct">0%</span></div>
      <div>Statut :        <span id="statStatus">En attente</span></div>
    </div>

    <!-- ── Légende ────────────────────────────────────── -->
    <div class="step-info">
      <span class="dot-vertex">▲ Sommets du triangle</span>
      &nbsp;|&nbsp;
      <span class="dot-point">● Point courant</span>
      &nbsp;|&nbsp;
      <span class="dot-mid">· Points générés</span>
      <br />
      Algorithme : choisir un sommet au hasard → placer le milieu → répéter
    </div>

    <!-- ── Script ─────────────────────────────────────── -->
    <script>
      const canvas = document.getElementById('canvas');
      const ctx    = canvas.getContext('2d');

      // ── Constantes ──────────────────────────────────
      const PRESETS = [100, 500, 1_000, 5_000, 10_000, 50_000, 100_000];
      const SPEEDS  = [1, 5, 20, 100, 500]; // points par frame

      // ── État ────────────────────────────────────────
      let totalIter   = 1_000;
      let ptsPerFrame = SPEEDS[2];
      let animId      = null;
      let running     = false;
      let currentPts      = [];
      let currentVertices = [];
      let drawnCount  = 0;

      // ── Redimensionnement ───────────────────────────
      function resize() {
        const w = canvas.parentElement.clientWidth;
        canvas.width  = w;
        canvas.height = w;
      }

      // ── Sommets du triangle équilatéral ─────────────
      function getVertices() {
        const W   = canvas.width;
        const H   = canvas.height;
        const pad = W * 0.1;
        const cx  = W / 2;

        return [
          { x: cx,                    y: pad     },  // haut
          { x: cx - (W - 2*pad) / 2,  y: H - pad },  // bas-gauche
          { x: cx + (W - 2*pad) / 2,  y: H - pad },  // bas-droit
        ];
      }

      // ── Précalcul des points (jeu du chaos) ─────────
      function computePoints(n) {
        const v = getVertices();

        // Départ au centroïde
        let cur = {
          x: (v[0].x + v[1].x + v[2].x) / 3,
          y: (v[0].y + v[1].y + v[2].y) / 3,
        };

        const result = [];

        for (let i = 0; i < n; i++) {
          const vi = v[Math.floor(Math.random() * 3)];
          cur = {
            x: (cur.x + vi.x) / 2,
            y: (cur.y + vi.y) / 2,
          };
          result.push({ x: cur.x, y: cur.y });
        }

        return { pts: result, vertices: v };
      }

      // ── Fond : contour + sommets ─────────────────────
      function drawBase(vertices) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Contour du triangle
        ctx.beginPath();
        ctx.moveTo(vertices[0].x, vertices[0].y);
        ctx.lineTo(vertices[1].x, vertices[1].y);
        ctx.lineTo(vertices[2].x, vertices[2].y);
        ctx.closePath();
        ctx.strokeStyle = 'rgba(255, 209, 102, 0.18)';
        ctx.lineWidth   = 1.5;
        ctx.stroke();

        // Points des sommets
        vertices.forEach(v => {
          ctx.beginPath();
          ctx.arc(v.x, v.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffd166';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(v.x, v.y, 8, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 209, 102, 0.4)';
          ctx.lineWidth   = 1;
          ctx.stroke();
        });
      }

      // ── Couleur d'un point selon le sommet le plus proche ──
      function ptColor(x, y, v) {
        const d0 = Math.hypot(x - v[0].x, y - v[0].y);
        const d1 = Math.hypot(x - v[1].x, y - v[1].y);
        const d2 = Math.hypot(x - v[2].x, y - v[2].y);
        const mn = Math.min(d0, d1, d2);

        if (mn === d0) return 'rgba(0,   255, 204, 0.85)';
        if (mn === d1) return 'rgba(255, 107, 107, 0.85)';
                       return 'rgba(255, 209, 102, 0.85)';
      }

      // ── Animation principale ────────────────────────
      function startAnimation() {
        if (running) {
          stopAnimation();
          return;
        }

        resize();
        currentVertices = getVertices();
        const result = computePoints(totalIter);
        currentPts  = result.pts;
        drawnCount  = 0;

        drawBase(currentVertices);

        running = true;
        document.getElementById('btnRun').textContent = '■ STOP';
        document.getElementById('btnRun').classList.add('running');
        document.getElementById('statStatus').textContent = 'Animation…';

        function frame() {
          if (!running) return;

          const end = Math.min(drawnCount + ptsPerFrame, currentPts.length);

          for (let i = drawnCount; i < end; i++) {
            const p = currentPts[i];
            ctx.beginPath();
            ctx.arc(p.x, p.y, 0.9, 0, Math.PI * 2);
            ctx.fillStyle = ptColor(p.x, p.y, currentVertices);
            ctx.fill();
          }

          drawnCount = end;

          const pct = Math.round((drawnCount / currentPts.length) * 100);
          document.getElementById('statPoints').textContent = drawnCount.toLocaleString('fr');
          document.getElementById('statPct').textContent    = pct + '%';

          if (drawnCount < currentPts.length) {
            animId = requestAnimationFrame(frame);
          } else {
            stopAnimation(true);
          }
        }

        animId = requestAnimationFrame(frame);
      }

      function stopAnimation(finished = false) {
        running = false;

        if (animId) {
          cancelAnimationFrame(animId);
          animId = null;
        }

        document.getElementById('btnRun').textContent = '▶ LANCER';
        document.getElementById('btnRun').classList.remove('running');
        document.getElementById('statStatus').textContent = finished ? 'Terminé ✓' : 'Arrêté';
        // Le canvas n'est volontairement pas effacé : le résultat reste visible.
      }

      function clearCanvas() {
        if (running) return; // pas d'effacement pendant l'animation

        currentPts  = [];
        drawnCount  = 0;
        currentVertices = getVertices();
        drawBase(currentVertices);

        document.getElementById('statPoints').textContent = '0';
        document.getElementById('statPct').textContent    = '0%';
        document.getElementById('statStatus').textContent = 'En attente';
      }

      // ── Slider d'itérations ─────────────────────────
      const slider  = document.getElementById('iterSlider');
      const display = document.getElementById('iterDisplay');
      const presets = document.querySelectorAll('.preset');

      function setIter(val) {
        totalIter = PRESETS[val - 1];
        display.textContent = totalIter >= 1_000
          ? (totalIter / 1_000) + 'K'
          : totalIter.toString();

        presets.forEach(b =>
          b.classList.toggle('active', parseInt(b.dataset.val) === parseInt(val))
        );
        slider.value = val;
      }

      slider.addEventListener('input', () => setIter(slider.value));
      presets.forEach(b => b.addEventListener('click', () => setIter(b.dataset.val)));
      setIter(3); // valeur initiale

      // ── Slider de vitesse ───────────────────────────
      const speedSlider = document.getElementById('speedSlider');
      const speedLabel  = document.getElementById('speedLabel');
      const speedNames  = ['×0.2', '×0.5', '×1', '×3', '×10'];

      speedSlider.addEventListener('input', () => {
        ptsPerFrame = SPEEDS[speedSlider.value - 1];
        speedLabel.textContent = speedNames[speedSlider.value - 1];
      });

      // ── Boutons ─────────────────────────────────────
      document.getElementById('btnRun').addEventListener('click', startAnimation);
      document.getElementById('btnClear').addEventListener('click', clearCanvas);

      // ── Init ────────────────────────────────────────
      resize();
      window.addEventListener('resize', () => {
        if (!running) {
          resize();
          drawBase(getVertices());
        }
      });

      drawBase(getVertices());
    </script>

  </body>
</html>
